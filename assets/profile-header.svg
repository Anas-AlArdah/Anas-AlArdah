<svg width="1280" height="360" viewBox="0 0 1280 360" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Anas AlArdah - Junior Full-Stack Developer</title>
  <desc id="desc">A professional GitHub profile header for a junior full-stack developer focused on React, Node.js, Express, and MySQL.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#07111F"/>
      <stop offset="0.48" stop-color="#0B2343"/>
      <stop offset="1" stop-color="#073A4F"/>
    </linearGradient>
    <linearGradient id="accent" x1="160" y1="70" x2="1120" y2="300" gradientUnits="userSpaceOnUse">
      <stop stop-color="#58A6FF"/>
      <stop offset="0.55" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#34D399"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="0 0 0 0 0.12 0 0 0 0 0.72 0 0 0 0 1 0 0 0 0.5 0"/>
      <feBlend in="SourceGraphic" mode="screen"/>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" stroke="#7DD3FC" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1280" height="360" rx="28" fill="url(#bg)"/>
  <rect width="1280" height="360" rx="28" fill="url(#grid)"/>
  <path d="M0 286C132 238 237 254 372 281C512 309 629 332 786 287C930 246 1023 168 1280 192V360H0V286Z" fill="#0EA5E9" fill-opacity="0.08"/>
  <circle cx="1088" cy="88" r="130" fill="#22D3EE" fill-opacity="0.11" filter="url(#softGlow)"/>
  <circle cx="197" cy="286" r="94" fill="#58A6FF" fill-opacity="0.12" filter="url(#softGlow)"/>

  <g opacity="0.95">
    <rect x="835" y="78" width="286" height="176" rx="18" fill="#071827" fill-opacity="0.62" stroke="#38BDF8" stroke-opacity="0.38"/>
    <circle cx="861" cy="105" r="5" fill="#F59E0B"/>
    <circle cx="881" cy="105" r="5" fill="#22D3EE"/>
    <circle cx="901" cy="105" r="5" fill="#34D399"/>
    <rect x="860" y="134" width="54" height="9" rx="4.5" fill="#58A6FF" fill-opacity="0.85"/>
    <rect x="860" y="160" width="152" height="8" rx="4" fill="#38BDF8" fill-opacity="0.6"/>
    <rect x="860" y="184" width="211" height="8" rx="4" fill="#22D3EE" fill-opacity="0.48"/>
    <rect x="860" y="208" width="134" height="8" rx="4" fill="#34D399" fill-opacity="0.45"/>
    <path d="M1012 140L1037 165L1012 190" stroke="#22D3EE" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M987 140L962 165L987 190" stroke="#58A6FF" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <g opacity="0.82">
    <rect x="880" y="279" width="220" height="10" rx="5" fill="url(#accent)"/>
    <rect x="930" y="301" width="170" height="7" rx="3.5" fill="#93C5FD" fill-opacity="0.36"/>
    <rect x="1012" y="323" width="88" height="7" rx="3.5" fill="#93C5FD" fill-opacity="0.24"/>
  </g>

  <g>
    <rect x="86" y="73" width="664" height="215" rx="24" fill="#061624" fill-opacity="0.58" stroke="url(#accent)" stroke-opacity="0.55"/>
    <text x="122" y="139" fill="#EAF6FF" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="54" font-weight="800">Anas AlArdah</text>
    <text x="124" y="184" fill="#7DD3FC" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="25" font-weight="650">Junior Full-Stack Developer</text>
    <text x="124" y="226" fill="#CDEBFF" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="22" font-weight="500">React | Node.js | Express | MySQL | Sequelize</text>
    <rect x="124" y="250" width="210" height="34" rx="17" fill="#22C55E" fill-opacity="0.14" stroke="#34D399" stroke-opacity="0.42"/>
    <text x="146" y="273" fill="#BBF7D0" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="16" font-weight="700">Open to internships</text>
    <rect x="350" y="250" width="224" height="34" rx="17" fill="#38BDF8" fill-opacity="0.12" stroke="#58A6FF" stroke-opacity="0.42"/>
    <text x="372" y="273" fill="#BAE6FD" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="16" font-weight="700">Building real projects</text>
  </g>
